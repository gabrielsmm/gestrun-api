services:
  postgres:
    image: postgres:16
    container_name: gestrun-db
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:?Defina DATABASE_USERNAME no arquivo .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD no arquivo .env}
      POSTGRES_DB: ${DATABASE_NAME:?Defina DATABASE_NAME no arquivo .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: gestrun-app
    depends_on:
      - postgres
    environment:
      APP_PROFILE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:?Defina DATABASE_NAME no arquivo .env}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Defina DATABASE_USERNAME no arquivo .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Defina CORS_ALLOWED_ORIGINS no arquivo .env}
    ports:
      - "8080:8080"

volumes:
  pgdata:
